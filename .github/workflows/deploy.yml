name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-avzr"
          EXCLUDE: "/.git/, /.github/, /.venv/, README.md, teste.html, teste.css, /.well-known/, .user.ini"
          SCRIPT_AFTER: |
            chown -R www:www ${{ secrets.DEPLOY_PATH }}
            find ${{ secrets.DEPLOY_PATH }} -type d -exec chmod 755 {} \;
            find ${{ secrets.DEPLOY_PATH }} -type f -exec chmod 644 {} \;
